# External Secrets Operator scenario for K3s using a Vault/OpenBao-style provider.
# This is a template: replace URLs, auth paths, roles, and secret paths.
# Do not commit real tokens, Vault root tokens, database URLs, SMTP URLs, or passwords.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-demo
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
# Install ESO with Helm, for example:
# helm repo add external-secrets https://charts.external-secrets.io
# helm upgrade --install external-secrets external-secrets/external-secrets \
#   --namespace external-secrets --create-namespace \
#   --set installCRDs=true
#
# Then configure provider auth. Prefer Kubernetes auth / workload identity over static tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
  namespace: platform-demo
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: platform-demo
spec:
  provider:
    vault:
      server: https://vault.example.internal
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: platform-demo-readonly
          serviceAccountRef:
            name: eso-vault-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: platform-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: platform-demo/app
        property: database_url
    - secretKey: smtp-url
      remoteRef:
        key: platform-demo/app
        property: smtp_url
    - secretKey: session-key
      remoteRef:
        key: platform-demo/app
        property: session_key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-using-external-secret
  namespace: platform-demo
  labels:
    app.kubernetes.io/name: web-using-external-secret
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-using-external-secret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-using-external-secret
    spec:
      containers:
        - name: web
          image: ghcr.io/example/web:1.0.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: session-key
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
